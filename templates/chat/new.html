{% extends "base.html" %}
{% load static %}

{% block title %}Нове повідомлення — SocialNet{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">

    <h1 class="h4 mb-3">Нове повідомлення</h1>

    <div class="mb-3 position-relative">
      <input
        type="text"
        id="new-chat-search"
        class="form-control"
        placeholder="Введіть імʼя користувача..."
        autocomplete="off"
        autofocus
      >
      <div id="new-chat-results" class="list-group mt-2"></div>
    </div>

    <a href="{% url 'chat_list' %}" class="btn btn-link text-muted px-0">← До повідомлень</a>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  const input = document.getElementById('new-chat-search');
  const results = document.getElementById('new-chat-results');
  let debounceTimer = null;

  input.addEventListener('input', function () {
    const query = input.value.trim();
    clearTimeout(debounceTimer);

    if (!query) {
      results.innerHTML = '';
      return;
    }

    debounceTimer = setTimeout(function () {
      fetch('{% url "mention_suggest" %}?q=' + encodeURIComponent(query), {
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
      })
        .then(function (res) { return res.json(); })
        .then(function (data) { render(data.results); })
        .catch(function () { results.innerHTML = ''; });
    }, 200);
  });

  function render(users) {
    results.innerHTML = '';

    if (!users.length) {
      results.innerHTML = '<p class="text-muted small mt-2">Нічого не знайдено.</p>';
      return;
    }

    users.forEach(function (u) {
      const form = document.createElement('form');
      form.method = 'post';
      form.action = '/chat/create/' + u.id + '/';

      const csrf = document.createElement('input');
      csrf.type = 'hidden';
      csrf.name = 'csrfmiddlewaretoken';
      csrf.value = '{{ csrf_token }}';
      form.appendChild(csrf);

      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.className = 'list-group-item list-group-item-action d-flex align-items-center gap-2 w-100 text-start';

      const avatar = u.avatar_url
        ? '<img src="' + u.avatar_url + '" width="36" height="36" class="rounded-circle" style="object-fit:cover;">'
        : '<div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white" ' +
          'style="width:36px;height:36px;">' + u.username.charAt(0).toUpperCase() + '</div>';

      btn.innerHTML = avatar + '<span>@' + u.username + '</span>';
      form.appendChild(btn);
      results.appendChild(form);
    });
  }
})();
</script>
{% endblock %}
