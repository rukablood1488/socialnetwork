{% extends "base.html" %}
{% load static %}

{% block title %}Новий груповий чат — SocialNet{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">

    <h1 class="h4 mb-3">Новий груповий чат</h1>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" id="create-group-form">
      {% csrf_token %}


      <div class="mb-3">
        <label for="chat-name" class="form-label">Назва групи</label>
        <input
          type="text"
          name="name"
          id="chat-name"
          class="form-control"
          placeholder="Наприклад, Однокурсники"
        >
      </div>


      <div class="mb-2 position-relative">
        <label for="participant-search" class="form-label">Учасники</label>
        <input
          type="text"
          id="participant-search"
          class="form-control"
          placeholder="Введіть імʼя користувача..."
          autocomplete="off"
          data-mention-url="{% url 'mention_suggest' %}"
        >
        <div id="participant-results"
             class="list-group position-absolute w-100 d-none"
             style="z-index:1000; max-height:220px; overflow-y:auto;"></div>
      </div>


      <div id="selected-participants" class="d-flex flex-wrap gap-2 mb-3"></div>
      <div id="participant-hidden-inputs"></div>

      <button type="submit" class="btn btn-primary w-100">Створити чат</button>
      <a href="{% url 'chat_list' %}" class="btn btn-link w-100 mt-1 text-muted">Скасувати</a>

    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'js/chat.js' %}"></script>
{% endblock %}
