<div class="modal fade" id="share-modal-{{ post.pk }}" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content anim-scale-in">
      <div class="modal-header">
        <h5 class="modal-title">Поділитись дописом</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
      </div>
      <div class="modal-body">
        {% if share_chats %}
          <div class="d-flex flex-column gap-1">
            {% for item in share_chats %}
              <form method="post" action="{% url 'post_share' post.pk item.chat.pk %}">
                {% csrf_token %}
                <button type="submit" class="share-target-btn">

                  {% if item.chat.is_group %}
                    <div class="avatar avatar-sm" style="background:var(--brand-gradient); color:#fff;">
                      <svg class="icon" width="16" height="16"><use href="#icon-users"></use></svg>
                    </div>
                  {% elif item.avatar_user.profile.avatar %}
                    <img src="{{ item.avatar_user.profile.avatar.url }}" class="avatar avatar-sm" alt="">
                  {% else %}
                    <div class="avatar avatar-sm">{{ item.label|first|upper }}</div>
                  {% endif %}

                  <span>{{ item.label }}</span>
                </button>
              </form>
            {% endfor %}
          </div>
        {% else %}
          <p class="text-muted small mb-0">
            У вас ще немає чатів. Спочатку напишіть комусь повідомлення.
          </p>
        {% endif %}
      </div>
    </div>
  </div>
</div>
