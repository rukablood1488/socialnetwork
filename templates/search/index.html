{% extends "base.html" %}
{% load static %}

{% block title %}Пошук — SocialNet{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7">

    <h1 class="h4 mb-3">Пошук</h1>

    
    <div class="mb-4 position-relative">
      <input
        type="text"
        id="search-input"
        class="form-control form-control-lg"
        placeholder="Користувачі та групи..."
        autocomplete="off"
        autofocus
      >
      <div id="search-spinner"
           class="spinner-border spinner-border-sm text-secondary position-absolute d-none"
           style="right:12px; top:50%; transform:translateY(-50%);"
           role="status">
        <span class="visually-hidden">Пошук...</span>
      </div>
    </div>

    
    <div id="search-results" data-search-url="{% url 'search_results' %}">
      <p class="text-muted text-center py-4">Почніть вводити, щоб знайти користувачів або групи.</p>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'js/search.js' %}"></script>
{% endblock %}
